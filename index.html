<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juego de Instrumentos</title>

<style>

body{
  margin:0;
  padding:40px;
  font-family:Arial, sans-serif;
  text-align:center;
  background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
  color:white;
  overflow-x:hidden;
}

#particles{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
}

.caja{
  position:relative;
  z-index:2;
  background:white;
  color:#222;
  max-width:1100px;
  margin:auto;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

h1{
  margin-top:0;
}

#panel{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

#panel button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  color:white;
}

#btnStart{ background:#28a745; }
#btnPausa{ background:#ff9800; }
#btnReiniciar{ background:#e53935; }

#respuestas{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.opcion{
  background:#2575fc;
  border:none;
  border-radius:12px;
  padding:10px;
  cursor:pointer;
  color:white;
  transition:.2s;
}

.opcion:hover{
  transform:scale(1.03);
  background:#1d5ed8;
}

.opcion img{
  width:100%;
  max-width:300px;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
  background:#ddd;
}

.barra{
  width:100%;
  height:12px;
  background:#ddd;
  border-radius:8px;
  overflow:hidden;
  margin:15px 0;
}

#progreso{
  width:100%;
  height:100%;
  background:#28a745;
  transition:width 1s linear;
}

#resultado{
  font-size:24px;
  font-weight:bold;
  min-height:30px;
}

@media(max-width:700px){

  #respuestas{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<div id="panel">

<button id="btnStart">
🎮 Empezar
</button>

<button id="btnPausa">
⏸️ Pausa
</button>

<button id="btnReiniciar">
🔄 Reiniciar
</button>

</div>

<p>
⏱️ Tiempo:
<span id="tiempo">15</span>s
</p>

<div class="barra">
  <div id="progreso"></div>
</div>

<div id="respuestas"></div>

<p id="resultado"></p>

<audio id="audio"></audio>

</div>

}

function sonidoError() {
  const audio = new Audio("error.mp3");

    .catch(error => console.error("Error con el sonido de error:", error));

   MEZCLAR
=================================== */

function mezclar(array){

  for(let i = array.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
    [array[j], array[i]];
  }

  return array;
}

/* ===================================
   VARIABLES
=================================== */

let actual = 0;
let puntos = 0;
let tiempo = 15;
let intervalo;
let pausado = false;

/* ===================================
   ELEMENTOS
=================================== */

const btnStart =
document.getElementById("btnStart");

const btnPausa =
document.getElementById("btnPausa");

const btnReiniciar =
document.getElementById("btnReiniciar");

const audio =
document.getElementById("audio");

/* ===================================
   START
=================================== */

btnStart.onclick = ()=>{

  actual = 0;
  puntos = 0;
  pausado = false;

  juego = mezclar(juego);

  btnStart.style.display = "none";

  cargarPregunta();
};

/* ===================================
   CARGAR
=================================== */

function cargarPregunta(){

  const p = juego[actual];

  document.getElementById("resultado")
  .innerText = "";

  audio.pause();

  audio.src = p.audio;

  console.log("AUDIO:", p.audio);

  audio.load();

  audio.play()
  .then(()=>{
    console.log("Audio OK");
  })
  .catch(err=>{
    console.log("Error audio:", err);
  });

  const cont =
  document.getElementById("respuestas");

  cont.innerHTML = "";

  const correctaTexto =
  p.opciones[p.correcta].texto;

  const mezcladas =
  mezclar([...p.opciones]);

  p.correcta =
  mezcladas.findIndex(
    op => op.texto === correctaTexto
  );

  mezcladas.forEach((op,i)=>{

    console.log("IMG:", op.img);

    const btn =
    document.createElement("button");

    btn.className = "opcion";

    btn.innerHTML = `
      <img
        src="${op.img}"
        onerror="
          this.src='https://via.placeholder.com/300x300?text=Sin+Imagen'
        "
      >
      <br><br>
      ${op.texto}
    `;

    btn.onclick = ()=> comprobar(i);

    cont.appendChild(btn);
  });

  tiempo = 15;

  actualizarTiempo();

  clearInterval(intervalo);

  intervalo = setInterval(()=>{

    if(!pausado){

      tiempo--;

      actualizarTiempo();

      if(tiempo <= 0){

        clearInterval(intervalo);

        comprobar(-1);
      }
    }

  },1000);
}

/* ===================================
   TIEMPO
=================================== */

function actualizarTiempo(){

  document.getElementById("tiempo")
  .innerText = tiempo;

  document.getElementById("progreso")
  .style.width =
  (tiempo / 15) * 100 + "%";
}

/* ===================================
   COMPROBAR
=================================== */

function comprobar(i){

  clearInterval(intervalo);

  const p = juego[actual];

  if(i === p.correcta){

    puntos++;

    document.getElementById("resultado")
    .style.color = "green";

    document.getElementById("resultado")
    .innerText = "✔ Correcto";

    sonidoCorrecto();

  }else{

    document.getElementById("resultado")
    .style.color = "red";

    document.getElementById("resultado")
    .innerText = "❌ Incorrecto";

    sonidoError();
  }

  setTimeout(()=>{

    actual++;

    if(actual < juego.length){

      cargarPregunta();

    }else{

      terminarJuego();
    }

  },1200);
}

/* ===================================
   PAUSA
=================================== */

btnPausa.onclick = ()=>{

  pausado = !pausado;

  if(pausado){

    btnPausa.innerText =
    "▶️ Continuar";

    audio.pause();

  }else{

    btnPausa.innerText =
    "⏸️ Pausa";

    audio.play()
    .catch(err=>console.log(err));
  }
};

/* ===================================
   REINICIAR
=================================== */

btnReiniciar.onclick = ()=>{

  clearInterval(intervalo);

  audio.pause();

  actual = 0;
  puntos = 0;
  tiempo = 15;

  document.getElementById("respuestas")
  .innerHTML = "";

  document.getElementById("resultado")
  .innerHTML = "";

  btnStart.style.display = "inline-block";

  actualizarTiempo();
};

/* ===================================
   FINAL
=================================== */

function terminarJuego(){

  document.querySelector(".caja")
  .innerHTML = `

    <h1>🎉 Juego terminado</h1>

    <h2>
      Puntuación:
      ${puntos}/${juego.length}
    </h2>

    <button
      onclick="location.reload()"
      style="
        padding:15px 25px;
        border:none;
        border-radius:10px;
        background:#2575fc;
        color:white;
        font-size:18px;
        cursor:pointer;
      ">
      🔄 Jugar otra vez
    </button>
  `;
}

/* ===================================
   PARTÍCULAS
=================================== */

const canvas =
document.getElementById("particles");

const ctx =
canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particulas = [];

for(let i=0;i<80;i++){

  particulas.push({

    x:Math.random()*canvas.width,

    y:Math.random()*canvas.height,

    r:Math.random()*3+1,

    dx:(Math.random()-0.5),

    dy:(Math.random()-0.5)
  });
}

function animar(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  particulas.forEach(p=>{

    p.x += p.dx;
    p.y += p.dy;

    if(
      p.x < 0 ||
      p.x > canvas.width
    ){
      p.dx *= -1;
    }

    if(
      p.y < 0 ||
      p.y > canvas.height
    ){
      p.dy *= -1;
    }

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.r,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
    "rgba(255,255,255,0.6)";

    ctx.fill();
  });

  requestAnimationFrame(animar);
}

animar();

window.addEventListener("resize",()=>{

  canvas.width = window.innerWidth;

  canvas.height = window.innerHeight;
});

</script>
